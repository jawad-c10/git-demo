name: CI

on:
  push:
    branches:
      - develop  # Change this to the branch you want to trigger the workflow on
      - feature*

jobs:


  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      
      - name: Determine changes for deployment
        id: changes
        run: |
          # Get the current SHA and base SHA for the PR
          BASE_SHA=${{ github.event.before }}
          CURRENT_SHA=${{ github.sha }}

          # Print the SHAs to the console
          echo "Base SHA: $BASE_SHA"
          echo "Current SHA: $CURRENT_SHA"

          # Check for changes in packages
          if git diff --name-only $BASE_SHA $CURRENT_SHA | grep -q "^packages/${{ matrix.service }}/"; then
            echo "changes=true" >> $GITHUB_ENV
          else
            echo "changes=false" >> $GITHUB_ENV
          fi
      - name: Print env
        run: printenv


    
